<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dog Friends Élégant.ci</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

<div class="logo">
  <img src="logo dog.png" alt="Dog Friends Logo"> 
</div>

<nav>
<a href="#produits">Chiens</a>
<a href="#commande">Commande</a>
<a href="vip.html" class="vip-btn">Confidentiel</a>
</nav>

</header>

<!-- HERO -->

<section class="hero">

<h1>Élevage & Services Premium</h1>
<p>Chiens de qualité — Dressage — Toilettage</p>

</section>

<!-- PRODUITS -->

<section id="produits" class="section">

<h2>Chiens disponibles</h2>

<div class="grid">

<div class="card">

<img src="https://images.unsplash.com/photo-1518717758536-85ae29035b6d">

<h3>Rottweiler</h3>
<p>250 000 FCFA</p>

<button onclick="selectDog('Rottweiler')">Commander</button>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1">

<h3>Berger Allemand</h3>
<p>300 000 FCFA</p>

<button onclick="selectDog('Berger Allemand')">Commander</button>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1537151608828-ea2b11777ee8">

<h3>Pitbull</h3>
<p>200 000 FCFA</p>

<button onclick="selectDog('Pitbull')">Commander</button>

</div>

</div>

</section>

<!-- COMMANDE -->

<section id="commande" class="section order">

<h2>Passer une commande</h2>

<form onsubmit="sendOrder(event)">

<input type="text" placeholder="Nom complet" required>
<input type="tel" placeholder="Téléphone" required>

<select id="dog">
<option>Choisir un chien</option>
<option>Rottweiler</option>
<option>Berger Allemand</option>
<option>Pitbull</option>
</select>

<textarea placeholder="Message"></textarea>

<button type="submit">Envoyer via WhatsApp</button>

</form>

</section>

<footer>

© 2026 Dog Friends Élégant.ci — Tous droits réservés

</footer>

<script src="script.js"></script>

</body>

</html>
